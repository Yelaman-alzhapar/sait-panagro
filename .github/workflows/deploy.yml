name: Deploy to hoster.kz

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: python3 build.py prod
        env:
          OUT_DIR: dist

      - name: Upload via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          D="${FTP_DIR%/}"
          L="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set ftp:passive-mode true; set net:max-retries 3; set net:timeout 30; open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\""
          # One-time: move the old Tilda export out of the web root (kept in /old-tilda-site)
          if lftp -c "$L; cls -1 \"$D/page35809277.html\"" >/dev/null 2>&1; then
            CMD="mkdir -p /old-tilda-site; rm -rf \"$D/dist\""
            for f in .htaccess 404.html css files images index.html js page35809277.html page36524306.html picture_library readme.txt robots.txt sitemap.xml; do
              CMD="$CMD; mv \"$D/$f\" \"/old-tilda-site/$f\""
            done
            lftp -c "$L; $CMD"
          fi
          lftp -c "$L; mirror -R --verbose --parallel=4 dist \"$D\""
